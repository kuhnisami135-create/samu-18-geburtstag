<!-- ==================== ANMELDE-FORMULAR ==================== -->
<section style="max-width: 480px; margin: 40px auto; padding: 0 20px;">
    
    <div style="
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 25px;
        padding: 35px 28px;
        backdrop-filter: blur(15px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    ">

        <h2 style="margin: 0 0 8px 0; text-align: center; font-size: 26px;">
            🎉 Anmeldung
        </h2>
        <p style="text-align: center; opacity: 0.75; margin-bottom: 28px; font-size: 15px;">
            Sag uns, ob du dabei bist!
        </p>

        <form action="https://formspree.io/f/mwlpdebp" method="POST">

            <!-- Name -->
            <div style="margin-bottom: 16px;">
                <input 
                    type="text" 
                    name="name" 
                    placeholder="Dein Name *" 
                    required
                    style="
                        width: 100%;
                        padding: 15px 16px;
                        border: none;
                        border-radius: 14px;
                        font-size: 16px;
                        background: rgba(255,255,255,0.95);
                        color: #111;
                        box-sizing: border-box;
                    "
                >
            </div>

            <!-- E-Mail (optional) -->
            <div style="margin-bottom: 16px;">
                <input 
                    type="email" 
                    name="email" 
                    placeholder="Deine E-Mail (optional)"
                    style="
                        width: 100%;
                        padding: 15px 16px;
                        border: none;
                        border-radius: 14px;
                        font-size: 16px;
                        background: rgba(255,255,255,0.95);
                        color: #111;
                        box-sizing: border-box;
                    "
                >
            </div>

            <!-- Teilnahme -->
            <div style="margin-bottom: 16px;">
                <select 
                    name="teilnahme" 
                    required
                    style="
                        width: 100%;
                        padding: 15px 16px;
                        border: none;
                        border-radius: 14px;
                        font-size: 16px;
                        background: rgba(255,255,255,0.95);
                        color: #111;
                        box-sizing: border-box;
                        appearance: none;
                    "
                >
                    <option value="" disabled selected>Kommst du? *</option>
                    <option value="Ja, ich komme">Ja, ich komme 🎉</option>
                    <option value="Nein, ich kann leider nicht">Nein, ich kann leider nicht</option>
                </select>
            </div>

            <!-- Nachricht (optional) -->
            <div style="margin-bottom: 20px;">
                <textarea 
                    name="nachricht" 
                    placeholder="Nachricht an Samu (optional)"
                    rows="3"
                    style="
                        width: 100%;
                        padding: 15px 16px;
                        border: none;
                        border-radius: 14px;
                        font-size: 16px;
                        background: rgba(255,255,255,0.95);
                        color: #111;
                        box-sizing: border-box;
                        resize: vertical;
                        font-family: inherit;
                    "
                ></textarea>
            </div>

            <!-- Versteckte Felder für Formspree -->
            <input type="hidden" name="_subject" value="🎉 Neue Anmeldung – Samus 18. Geburtstag">
            <input type="hidden" name="_template" value="table">

            <!-- Absenden-Button -->
            <button 
                type="submit"
                style="
                    width: 100%;
                    padding: 16px;
                    border: none;
                    border-radius: 14px;
                    font-size: 17px;
                    font-weight: 700;
                    background: white;
                    color: #111;
                    cursor: pointer;
                    transition: transform 0.15s;
                "
            >
                Anmeldung absenden
            </button>
        </form>

        <p style="text-align: center; font-size: 13px; opacity: 0.5; margin-top: 18px; margin-bottom: 0;">
            * Pflichtfelder
        </p>
    </div>
</section>
