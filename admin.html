<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin – Gästeliste</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #151515, #292929);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 30px 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 32px;
        }

        h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button {
            background: white;
            color: #111;
        }

        .logout-button {
            background: rgba(255, 80, 80, 0.2);
            color: white;
            margin-top: 20px;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            text-align: center;
            display: none;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .stat {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            opacity: 0.7;
        }

        #adminPanel {
            display: none;
        }

        .participant {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .participant.yes {
            border-left: 4px solid #4ade80;
        }

        .participant.no {
            border-left: 4px solid #f87171;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- LOGIN PANEL -->
    <div id="loginPanel" class="card">
        <h1>🔐 Admin</h1>
        <p style="text-align: center; opacity: 0.8; margin-bottom: 25px;">
            Melde dich an, um die Gästeliste zu sehen.
        </p>

        <form id="loginForm">
            <input
                type="email"
                id="email"
                placeholder="E-Mail-Adresse"
                required
            >
            <button type="submit" class="login-button">
                Login-Link senden
            </button>
        </form>

        <div id="loginMessage" class="message"></div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel">

        <div class="card">
            <h1>🎉 Gästeliste</h1>

            <div class="stats">
                <div class="stat">
                    <span id="totalCount" class="stat-number">0</span>
                    <span class="stat-label">Gesamt</span>
                </div>
                <div class="stat">
                    <span id="yesCount" class="stat-number">0</span>
                    <span class="stat-label">Dabei</span>
                </div>
                <div class="stat">
                    <span id="noCount" class="stat-number">0</span>
                    <span class="stat-label">Nicht dabei</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>👥 Teilnehmer</h2>
            <div id="participants">
                Teilnehmer werden geladen...
            </div>

            <button id="logoutButton" class="logout-button" type="button">
                Ausloggen
            </button>
        </div>

    </div>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Dein JavaScript -->
<script src="admin.js"></script>

</body>
</html>
