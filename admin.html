<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin – Samu wird 18 🎉</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #151515,
                    #292929
                );

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .container {

            width: 100%;

            max-width: 650px;
        }


        .card {

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.15);

            border-radius: 25px;

            padding: 30px 25px;

            backdrop-filter:
                blur(15px);

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.4);

            margin-bottom: 20px;
        }


        h1 {

            margin-top: 0;

            text-align: center;

            font-size: 32px;
        }


        h2 {

            margin-top: 0;
        }


        input {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            margin-bottom: 12px;
        }


        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }


        .login-button {

            background: white;

            color: #111;
        }


        .logout-button {

            background:
                rgba(255,80,80,0.2);

            color: white;

            margin-top: 20px;
        }


        .message {

            margin-top: 15px;

            padding: 12px;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.1);

            text-align: center;
        }


        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin: 20px 0;
        }


        .stat {

            background:
                rgba(255,255,255,0.08);

            border-radius: 15px;

            padding: 15px;

            text-align: center;
        }


        .stat-number {

            display: block;

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 5px;
        }


        .stat-label {

            font-size: 13px;

            opacity: 0.8;
        }


        .participant {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding: 15px;

            margin-bottom: 10px;

            background:
                rgba(255,255,255,0.08);

            border-radius: 12px;
        }


        .participant strong {

            font-size: 17px;
        }


        .participant span {

            white-space: nowrap;
        }


        .error {

            background:
                rgba(255,80,80,0.2);

            padding: 15px;

            border-radius: 12px;
        }


        .hidden {

            display: none !important;
        }


        @media (max-width: 500px) {

            .stats {

                grid-template-columns:
                    1fr;
            }


            .participant {

                flex-direction: column;

                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ================================= -->
    <!-- LOGIN -->
    <!-- ================================= -->

    <div
        id="loginPanel"
        class="card"
    >

        <h1>
            🔐 Admin
        </h1>

        <p style="text-align:center;">
            Melde dich an, um die
            Gästeliste zu sehen.
        </p>


        <form id="loginForm">

            <input
                id="email"
                type="email"
                placeholder="Deine E-Mail-Adresse"
                autocomplete="email"
                required
            >


            <button
                type="submit"
                class="login-button"
            >
                Login-Link senden
            </button>

        </form>


        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>



    <!-- ================================= -->
    <!-- ADMIN -->
    <!-- ================================= -->

    <div
        id="adminPanel"
        class="hidden"
    >


        <div class="card">

            <h1>
                🎉 Gästeliste
            </h1>


            <div class="stats">

                <div class="stat">

                    <span
                        id="totalCount"
                        class="stat-number"
                    >
                        0
                    </span>

                    <span class="stat-label">
                        Antworten
                    </span>

                </div>


                <div class="stat">

                    <span
                        id="yesCount"
                        class="stat-number"
                    >
                        0
                    </span>

                    <span class="stat-label">
                        Dabei
                    </span>

                </div>


                <div class="stat">

                    <span
                        id="noCount"
                        class="stat-number"
                    >
                        0
                    </span>

                    <span class="stat-label">
                        Nicht dabei
                    </span>

                </div>

            </div>

        </div>



        <div class="card">

            <h2>
                👥 Teilnehmer
            </h2>


            <div id="participants">

                Teilnehmer werden geladen...

            </div>


            <button
                id="logoutButton"
                class="logout-button"
                type="button"
            >
                Ausloggen
            </button>

        </div>


    </div>


</div>



<!-- ================================= -->
<!-- SUPABASE -->
<!-- ================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- ================================= -->
<!-- DEIN ADMIN JAVASCRIPT -->
<!-- ================================= -->

<script src="admin.js"></script>


</body>

</html>
